# Netlify settings for the portfolio.
# Plain HTML/CSS/JS: no build step, the repo root is published as-is.
# (Git-ignored folders such as private/ and DYKYP/ are never in the repo, so never published.)

[build]
  publish = "."

# Security headers for every page. No page needs the camera, GPS or microphone.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"

# Fonts rarely change: let browsers keep them for a week.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
